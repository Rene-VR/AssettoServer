# drift_zones.yml - Seacrest AI drift zones (2026-10-25, all chevron corners: 131 zones on 24 roads, from ai_splines\drift\scan_chevron_corners.py)
# Read by the custom AssettoServer build (driftzones.cs). Delete/rename this file = drift off.
# Center = middle of the chevron faces, game coords [x, y(height), z].
# At startup the server log shows per zone which lanes were found and which ones drift (outside lane only).

AngleDeg: 25            # extra body yaw at full drift (nose into the corner)
CounterSteerRatio: 0.3  # front wheels counter-steer = drift angle x this (limited by WheelAngleScale / full lock)
OutwardMeters: 0.5      # slide to the outside of the corner at full drift
SpeedFactor: 1.0        # corner speed x this for drifting cars (1.1 = 10 % faster)
RearWheelSpin: 2.0      # rear tyres spin this much faster at full drift (smoke test, 1 = off)
BlendMeters: 50         # ramp in before / out after the corner part
BlendRate: 5            # smoothing per second (2026-10-27: was 2.5, BlendMeters was 15 - drift started too late)
Chance: 0.25            # share of cars that drift (2026-10-25: 1 in 4; was 1.0 in the prototype)
SearchRadius: 120       # lanes within this distance of the centre are checked
HeightTolerance: 20
MaxCornerRadius: 200    # spline radius <= this counts as the corner
MaxLaneGapMeters: 12    # another lane closer than this on the outside of the corner = not the outside lane
MinCornerMeters: 10     # ignore corner parts shorter than this (junction stubs)
MinCornerRadius: 25    # lane parts with a point tighter than this never drift (junction turns)
MinSpeedKmh: 60        # no drift below this speed
Debug: true             # log every car that starts drifting

